# pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelwatch"
version = "0.1.0"
description = "Kernel and system health diagnostics for Arch Linux"
authors = [
{name = "Kiarsah Karimi"}
]
requires-python = ">=3.10"
dependencies = [
"typer>=0.12.0",
"rich>=13.0.0",
"psutil>=5.9.0"
]

[project.scripts]
kernelwatch = "kernelwatch.cli:app"
